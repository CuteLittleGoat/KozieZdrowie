name: Budowa i wdrożenie KozieZdrowie

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scal i przeanalizuj CSV
        run: python scripts/build_data.py

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Przygotuj artefakt strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Wdróż stronę
        id: deployment
        uses: actions/deploy-pages@v4
